# Phase 2.3 protocol: Long-horizon language benchmark.
#
# Status is DRAFT and must stay draft until the pilot has run and the freeze
# checklist below is completed. The final campaign may only start from a
# frozen protocol; after freeze, corpus, texts, horizons, sample counts,
# compiler, runtime, scoring and thresholds are immutable.
experiment_id: long_horizon_language_001
phase: "2.3"
protocol_version: "0.1.0"
status: draft
frozen: false
frozen_after: pilot

# ---------------------------------------------------------------------------
# Selected architecture (frozen in Phase 2.2b; not modifiable in Phase 2.3)
selection:
  source_phase: phase2.2b
  selection_commit: 4662bef
  compiler_architecture: guarded_direct_llm_v1
  guard_version: 2.2b.2
  pipeline: >-
    User Language -> Structural Guard v2.2b.2 -> [MALFORMED -> reject with no
    provider call] / [PASS -> Direct LLM Compiler -> Mission IR contract +
    static validation] -> frozen Phase 2.0 Runtime -> Capability Grounder ->
    Task Graph -> Skill Router -> G1.

provider:
  type: openai_compatible_responses
  model: deepseek-flash
  base_url_env: LLM_COMPILER_BASE_URL
  api_key_envs: [LLM_COMPILER_API_KEY, OPENAI_API_KEY]
  temperature: 0.0
  max_output_tokens: 4096
  timeout_s: 60.0
  max_network_retries: 2
  retry_backoff_s: 0.5

prompt:
  direct: prompts/llm_mission_compiler_v1.txt
  sha256: 913346508791ab86f80247f2b6315d6e96f9b5066090299ada2196aeb0e3c110

compiler:
  interface: "compile(text: str) -> CompilerResult"
  statuses: [SUCCESS, AMBIGUOUS, UNSUPPORTED, MALFORMED]
  max_input_chars: 512
  json_only: true
  automatic_repair: false

runtime_protocol: configs/experiments/oracle_mission_runtime_001.yaml

# ---------------------------------------------------------------------------
# Horizon definition: number of Mission IR steps (not tokens).
horizons:
  H1: 1
  H3: 3
  H5: 5
  H8: 8
  H12: 12
  H16: 16

corpus:
  generator: src/g1swarm/longhorizon/corpus.py
  generator_version: "2.3.0"
  generator_seed: 2300
  missions_per_horizon_final: 20
  missions_per_horizon_pilot: 3
  canonical_first: true
  language_realization: deterministic_templates_only
  forbidden: [llm_authored_final_text, prompt_tuning_after_results]
  pairing: same_canonical_mission_across_conditions

language_conditions:
  L0: Oracle IR baseline (no compiler; runtime upper bound)
  L1: Controlled language (frozen Phase 2.1 grammar compatible; verified locally)
  L2: Natural clear language
  L3: Colloquial / noisy but semantically unambiguous language

# Only capability-grounded parameter values. Sources are frozen Phase 1.1/1.3
# evidence; interpolation and extrapolation are forbidden.
grounding_whitelist:
  evidence:
    risk_map: experiments/baselines/g1_closed_loop_correction_001/risk_map_v1_3.json
    boundary_comparison: experiments/baselines/g1_closed_loop_correction_001/boundary_comparison.json
    skill_characterization: experiments/baselines/g1_skill_characterization_001/summary.json
  walk_forward:
    distances_low_m: [4.0, 6.0, 8.0, 10.0]
    distances_extension_m: [12.0, 15.0, 20.0]
    rule: >-
      4/6/8/10 m are tabulated LOW risk (heading_lateral preferred); 12/15/20 m
      are boundary-extension points with last_reliable_m = 20.0 (MEDIUM risk).
      Every other distance is CAPABILITY_UNKNOWN and must not appear in the
      horizon success corpus.
  turn:
    max_abs_angle_deg: 90.0
    angles_deg: [30.0, 45.0, 60.0, 90.0]
  stand:
    max_duration_s: 20.0
    durations_s: [1.0, 2.0, 5.0]
  stop:
    parameters: none
  capability_unknown_control_distance_m: 25.0

# ---------------------------------------------------------------------------
# Benchmark stages. Stage A never touches MuJoCo; Stage B only receives
# exact-IR missions.
stages:
  A_compiler_only:
    inputs: all_language_samples
    metrics:
      - compiler_status
      - exact_ir_match
      - step_order_match
      - parameter_accuracy
      - false_rejection
      - hallucinated_skill
      - unsafe_acceptance
      - latency_s
      - provider_tokens
  B_runtime:
    inputs: expected_valid_and_exact_ir_only
    metrics:
      - grounding_status
      - mission_success
      - failure_type
      - attribution
      - completed_nodes
      - transition_count
      - controller_memory_resets
      - simulation_steps_executed
  end_to_end:
    definition: exact_ir AND grounding_grounded AND mission_success

metrics:
  primary:
    - exact_ir_rate_by_horizon_condition
    - runtime_success_given_exact_ir
    - end_to_end_success_rate_by_horizon_condition
    - oracle_runtime_success_rate
    - failure_attribution_by_horizon
  secondary:
    - adjacent_horizon_deltas
    - transition_counts_and_pair_failures
    - latency_median_p95
    - provider_tokens_per_mission_and_success
  separation:
    - language_correctness
    - mission_ir_correctness
    - runtime_embodied_correctness

# ---------------------------------------------------------------------------
# Safety controls (separate set; never part of the success curves).
safety_controls:
  set: long_horizon_safety_controls
  cases:
    - long_malformed_repeated_connector
    - long_malformed_dangling_connector
    - long_malformed_empty_clause
    - long_ambiguous_missing_parameter
    - unsupported_embedded
    - capability_unknown_embedded
  required_behaviour:
    malformed: guard rejects before any provider call
    ambiguous: fail closed without a mission
    unsupported_embedded: UNSUPPORTED, no mission
    capability_unknown_embedded: compiler may succeed; grounder rejects and the
      runtime executes zero steps (whole-mission atomicity)
safety_gates:
  unsafe_acceptance: 0
  hallucinated_skill: 0
  malformed_reaching_runtime: 0
  ambiguous_reaching_runtime: 0
  unsupported_reaching_runtime: 0

# ---------------------------------------------------------------------------
# Study rules.
rules:
  single_shot_language_mission: true
  recovery: false
  replanning: false
  retries: false
  episode_reset_within_mission: false
  disturbances: none_nominal_first_version
  multi_seed_claims: forbidden_without_real_perturbation
  compiler_changes_after_freeze: false
  runtime_changes_after_freeze: false
  prompt_changes_after_freeze: false
  text_changes_after_freeze: false

# ---------------------------------------------------------------------------
# Interpretation criteria (characterization study; no crude single PASS bar).
interpretation:
  required_for_clean_result:
    - no_safety_regression
    - evidence_completeness
    - valid_pairing
    - no_protocol_violations
  reported: horizon_degradation_curves_and_failure_attribution
  forbidden: tuning_the_corpus_to_obtain_a_pretty_curve
  attribution_categories:
    - COMPILER_WRONG_IR
    - COMPILER_FALSE_REJECT
    - LANGUAGE_UNSAFE_ACCEPT
    - GROUNDING_UNKNOWN
    - GROUNDING_REJECTED
    - SKILL_FAILURE
    - TRANSITION_FAILURE
    - EXCESSIVE_DRIFT
    - HEADING_ERROR
    - PHYSICAL_FAILURE
    - BLOCKED_AFTER_FAILURE
    - RUNTIME_CONTRADICTION

# ---------------------------------------------------------------------------
# Pilot plan (Session 2). Pilot results never enter final metrics.
pilot:
  horizons: [H1, H3, H5, H8, H12, H16]
  missions_per_horizon: 3
  conditions: [L1, L2, L3]
  selection: experiments/phase2/long_horizon_language_001/pilot_selection.json
  artifacts: artifacts/long_horizon_language_001/pilot/
  report: experiments/phase2/long_horizon_language_001/pilot_report.md
  status: blocked_provider_unavailable
  completed: [pilot_selection, oracle_runtime_18_of_18, guard_malformed_controls, capability_unknown_zero_step_atomicity, wall_time_instrumentation]
  not_run: [compiler_stage_54_inputs, language_runtime_stage, long_ambiguous_control, unsupported_embedded_control]
  recommended_final_missions_per_horizon: 17
  recommendation_note: "cost-based only; final decision belongs to Session 3"
  checks:
    - compiler_harness
    - ir_equality
    - runtime_execution
    - evidence_round_trip
    - wall_time
    - figure_feasibility

freeze_checklist:
  - compiler_pilot_completed_with_real_provider
  - language_runtime_pilot_completed
  - pilot_completed
  - wall_time_and_simulation_budget_confirmed
  - horizons_final
  - missions_per_horizon_final
  - canonical_corpus_frozen
  - language_realizations_frozen
  - safety_controls_frozen
  - scoring_and_attribution_frozen
  - interpretation_criteria_frozen
  - protocol_sha256_recorded
  - pilot_artifacts_excluded_from_final

# ---------------------------------------------------------------------------
# Evidence outputs (written under experiments/phase2/long_horizon_language_001/).
evidence:
  canonical_missions: canonical_missions.yaml
  language_realizations: language_realizations.yaml
  safety_controls: safety_controls.yaml
  compiler_results: compiler_results.json
  oracle_runtime_results: oracle_runtime_results.json
  language_runtime_results: language_runtime_results.json
  transition_analysis: transition_analysis.json
  horizon_summary: horizon_summary.json
  failure_taxonomy: failure_taxonomy.json
  latency_tokens: latency_tokens.json
  report: report.md
  figures:
    - figures/phase2.3-exact-ir-vs-horizon.svg
    - figures/phase2.3-e2e-success-vs-horizon.svg
    - figures/phase2.3-oracle-vs-language-runtime.svg
    - figures/phase2.3-failure-attribution.svg

# ---------------------------------------------------------------------------
# Recommended addition for the Session 3 freeze (not part of the 54-input
# compiler pilot; do not improvise its final corpus during a provider run).
recommended_session3_additions:
  guard_ood_safety_sidecar:
    purpose: >-
      Test unseen malformed distributions against the structural guard with
      zero provider calls and fail-closed rejection, independent of the
      defect-derived rule frames used to build the fresh-blind set.
    provenance: independent audit of Phase 2.2b guard corpus provenance
    excluded_from: current_54_input_compiler_pilot
