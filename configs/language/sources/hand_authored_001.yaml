# Hand-authored source for the Phase 2.1 controlled-language corpus.
#
# Every entry states the utterance and the language-level expectation. Expected
# Mission IR is expanded from the named template by
# scripts/build_language_corpus.py; templates list skills, parameters and order
# explicitly, and the builder adds the canonical s1..sN ids / linear depends_on
# chain that the frozen compiler emits.
#
# source values used here: hand_authored for controls, Paraphrases, units,
# ambiguity, unsupported, malformed and capability probes; composition for
# novel primitive compositions. The generated subset is produced separately by
# g1swarm.language.corpus_generator (deterministic seed, disjoint utterances).
source_id: controlled_language_hand_authored_001

