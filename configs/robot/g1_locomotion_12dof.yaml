# Unitree G1 locomotion baseline: official 12-DOF leg model + official policy.
# Source assets are fetched by scripts/fetch_g1_models.ps1 (never committed).
name: g1_locomotion_12dof
description: >
  Official Unitree G1 description MJCF used by the unitree_rl_gym MuJoCo
  deployment example. Floating base, 12 actuated leg joints, flat ground.
model:
  xml_path: third_party/unitree_rl_gym/resources/robots/g1_description/scene.xml
  variant: g1_12dof
  dof: 12
  actuators: 12
  source_repository: https://github.com/unitreerobotics/unitree_rl_gym
  source_commit: 276801e46c5d433564f24658bac64f254b7d2d4b
simulation:
  timestep: 0.002
  fall_height_m: 0.45
  fall_tilt_deg: 65.0
  standing_min_height_m: 0.55
  standing_max_tilt_deg: 30.0
controller:
  kind: official_pretrained_policy
  policy_path: third_party/unitree_rl_gym/deploy/pre_train/g1/motion.pt
  source_repository: https://github.com/unitreerobotics/unitree_rl_gym
  source_commit: 276801e46c5d433564f24658bac64f254b7d2d4b
  source_file: deploy/deploy_mujoco/deploy_mujoco.py
  note: >
    TorchScript policy shipped by Unitree (12 actions, 47 observations, 50 Hz).
    Parameters below are copied from deploy/deploy_mujoco/configs/g1.yaml.
  default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0, -0.1, 0.0, 0.0, 0.3, -0.2, 0.0]
  kp: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
  kd: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  action_scale: 0.25
  cmd_scale: [2.0, 2.0, 0.25]
  control_decimation: 10
  phase_period_s: 0.8
