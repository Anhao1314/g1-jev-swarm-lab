# Full-body Unitree G1 MJCF from unitree_mujoco.
# Compatibility evidence only: this phase ships no official controller for
# this 29-DOF model path, so no locomotion skill uses it.
name: g1_full_29dof
description: >
  Official full-body G1 MJCF shipped by unitree_mujoco (29 torque motors,
  floating base). Used for the native-Windows model compatibility spike.
model:
  xml_path: third_party/unitree_mujoco/unitree_robots/g1/scene_29dof.xml
  variant: g1_29dof
  dof: 29
  actuators: 29
  source_repository: https://github.com/unitreerobotics/unitree_mujoco
  source_commit: 1eb6642e3f3fdfb7fb13a9794fd6a2dd93ea0e7d
simulation:
  timestep: 0.002
  fall_height_m: 0.45
  fall_tilt_deg: 65.0
  standing_min_height_m: 0.55
  standing_max_tilt_deg: 30.0
controller:
  kind: none
  note: >
    No official native-Windows controller is available for this model in this
    phase; the compatibility spike steps it with zero torque.
