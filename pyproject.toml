[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-jev-swarm-lab"
version = "0.0.0"
description = "Research testbed for long-horizon Unitree G1 tasks with Jev decision models, multi-swarm orchestration, and RL skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Anhao1314" }]
dependencies = [
    "mujoco==3.15.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "lark==1.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The learned locomotion controller needs PyTorch. It is intentionally not a
# dependency here because the project must only use the CUDA 13.0 wheel index
# on this machine:
#   pip install torch --index-url https://download.pytorch.org/whl/cu130

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
