<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
<title id="title">Phase 1.3 correction comparison</title><desc id="desc">Line chart comparing open-loop, heading-only and heading-plus-lateral drift from four to ten metres.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
.title{font-size:20px;font-weight:700}.label{font-size:13px}.small{font-size:11px;fill:#57606a}
.grid{stroke:#d0d7de;stroke-width:1}.axis{stroke:#57606a;stroke-width:1.2}
</style>
<text class="title" x="36" y="38">Phase 1.3 — Closed-loop correction reduced drift</text>
<text class="small" x="36" y="60">Absolute lateral drift; same Unitree policy weights in every treatment</text>
<line class="axis" x1="90" y1="405" x2="770" y2="405"/><line class="axis" x1="90" y1="90" x2="90" y2="405"/>
<line class="grid" x1="90" y1="300" x2="770" y2="300"/><line class="grid" x1="90" y1="195" x2="770" y2="195"/><line class="grid" x1="90" y1="90" x2="770" y2="90"/>
<text class="small" x="51" y="409">0.0</text><text class="small" x="51" y="304">0.5</text><text class="small" x="51" y="199">1.0</text><text class="small" x="51" y="94">1.5</text>
<polyline points="150,346 330,290 510,206 690,103" fill="none" stroke="#cf222e" stroke-width="3"/><circle cx="150" cy="346" r="5" fill="#cf222e"/><circle cx="330" cy="290" r="5" fill="#cf222e"/><circle cx="510" cy="206" r="5" fill="#cf222e"/><circle cx="690" cy="103" r="5" fill="#cf222e"/>
<polyline points="150,397 330,398 510,395 690,389" fill="none" stroke="#0969da" stroke-width="3"/><circle cx="150" cy="397" r="5" fill="#0969da"/><circle cx="330" cy="398" r="5" fill="#0969da"/><circle cx="510" cy="395" r="5" fill="#0969da"/><circle cx="690" cy="389" r="5" fill="#0969da"/>
<polyline points="150,401 330,405 510,404 690,401" fill="none" stroke="#1a7f37" stroke-width="3"/><circle cx="150" cy="401" r="5" fill="#1a7f37"/><circle cx="330" cy="405" r="5" fill="#1a7f37"/><circle cx="510" cy="404" r="5" fill="#1a7f37"/><circle cx="690" cy="401" r="5" fill="#1a7f37"/>
<text class="label" x="150" y="430" text-anchor="middle">4 m</text><text class="label" x="330" y="430" text-anchor="middle">6 m</text><text class="label" x="510" y="430" text-anchor="middle">8 m</text><text class="label" x="690" y="430" text-anchor="middle">10 m</text>
<circle cx="230" cy="466" r="5" fill="#cf222e"/><text class="small" x="242" y="470">Open loop</text>
<circle cx="370" cy="466" r="5" fill="#0969da"/><text class="small" x="382" y="470">Heading only</text>
<circle cx="525" cy="466" r="5" fill="#1a7f37"/><text class="small" x="537" y="470">Heading + lateral</text>
</svg>