<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
<title id="title">Phase 2.2 Lark vs DeepSeek compiler benchmark</title>
<desc id="desc">Comparison of blind benchmark metrics, plus controlled malformed safety failure and latency tradeoff.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
.title{font-size:22px;font-weight:700}.sub{font-size:12px;fill:#57606a}.label{font-size:12px}.value{font-size:12px;font-weight:700}
.grid{stroke:#d0d7de;stroke-width:1}.axis{stroke:#57606a;stroke-width:1.2}
</style>
<text class="title" x="36" y="38">Phase 2.2 — Lark vs DeepSeek-v4.1flash</text>
<text class="sub" x="36" y="60">Blind benchmark gains were strong, but the controlled regression exposed 2 malformed inputs accepted as executable Missions.</text>

<!-- legend -->
<rect x="660" y="28" width="14" height="14" fill="#0969da"/><text class="sub" x="682" y="40">Lark</text>
<rect x="740" y="28" width="14" height="14" fill="#1a7f37"/><text class="sub" x="762" y="40">DeepSeek</text>

<!-- chart area -->
<line class="axis" x1="105" y1="360" x2="915" y2="360"/>
<line class="axis" x1="105" y1="95" x2="105" y2="360"/>
<line class="grid" x1="105" y1="307" x2="915" y2="307"/>
<line class="grid" x1="105" y1="254" x2="915" y2="254"/>
<line class="grid" x1="105" y1="201" x2="915" y2="201"/>
<line class="grid" x1="105" y1="148" x2="915" y2="148"/>
<line class="grid" x1="105" y1="95" x2="915" y2="95"/>
<text class="sub" x="65" y="364">0.0</text><text class="sub" x="65" y="311">0.2</text><text class="sub" x="65" y="258">0.4</text><text class="sub" x="65" y="205">0.6</text><text class="sub" x="65" y="152">0.8</text><text class="sub" x="65" y="99">1.0</text>

<!-- metric 1 exact IR -->
<rect x="145" y="220" width="34" height="140" fill="#0969da"/><rect x="183" y="95" width="34" height="265" fill="#1a7f37"/>
<text class="value" x="162" y="212" text-anchor="middle">0.53</text><text class="value" x="200" y="87" text-anchor="middle">1.00</text>
<text class="label" x="181" y="386" text-anchor="middle">Blind exact IR</text>

<!-- metric 2 coverage -->
<rect x="295" y="225" width="34" height="135" fill="#0969da"/><rect x="333" y="95" width="34" height="265" fill="#1a7f37"/>
<text class="value" x="312" y="217" text-anchor="middle">0.51</text><text class="value" x="350" y="87" text-anchor="middle">1.00</text>
<text class="label" x="331" y="386" text-anchor="middle">Open coverage</text>

<!-- metric 3 composition -->
<rect x="445" y="294" width="34" height="66" fill="#0969da"/><rect x="483" y="95" width="34" height="265" fill="#1a7f37"/>
<text class="value" x="462" y="286" text-anchor="middle">0.25</text><text class="value" x="500" y="87" text-anchor="middle">1.00</text>
<text class="label" x="481" y="386" text-anchor="middle">Composition</text>

<!-- metric 4 ambiguity -->
<rect x="595" y="112" width="34" height="248" fill="#0969da"/><rect x="633" y="95" width="34" height="265" fill="#1a7f37"/>
<text class="value" x="612" y="104" text-anchor="middle">0.94</text><text class="value" x="650" y="87" text-anchor="middle">1.00</text>
<text class="label" x="631" y="386" text-anchor="middle">Ambiguity recall</text>

<!-- metric 5 unsupported -->
<rect x="745" y="228" width="34" height="132" fill="#0969da"/><rect x="783" y="112" width="34" height="248" fill="#1a7f37"/>
<text class="value" x="762" y="220" text-anchor="middle">0.50</text><text class="value" x="800" y="104" text-anchor="middle">0.94</text>
<text class="label" x="781" y="386" text-anchor="middle">Unsupported recall</text>

<!-- summary cards -->
<rect x="80" y="425" width="250" height="95" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
<text x="100" y="450" font-size="14" font-weight="700">Coverage gain</text>
<text x="100" y="477" font-size="24" font-weight="700">+0.4894</text>
<text class="sub" x="100" y="500">0.5106 → 1.0000 (~1.96×)</text>

<rect x="365" y="425" width="250" height="95" rx="10" fill="#ffebe9" stroke="#cf222e"/>
<text x="385" y="450" font-size="14" font-weight="700">Hard safety gate</text>
<text x="385" y="477" font-size="24" font-weight="700">2 unsafe accepts</text>
<text class="sub" x="385" y="500">Controlled malformed connector cases</text>

<rect x="650" y="425" width="250" height="95" rx="10" fill="#fff8c5" stroke="#9a6700"/>
<text x="670" y="450" font-size="14" font-weight="700">Median latency</text>
<text x="670" y="477" font-size="24" font-weight="700">2.227 s</text>
<text class="sub" x="670" y="500">vs 91.9 µs for Lark (~24k× slower)</text>
</svg>