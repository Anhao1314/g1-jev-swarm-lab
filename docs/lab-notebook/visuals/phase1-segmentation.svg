<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
<title id="title">Phase 1.2b segmentation comparison</title><desc id="desc">Line chart showing lateral drift for direct and segmented execution at 4, 6, and 8 metres.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
.title{font-size:20px;font-weight:700}.label{font-size:13px}.small{font-size:11px;fill:#57606a}
.grid{stroke:#d0d7de;stroke-width:1}.axis{stroke:#57606a;stroke-width:1.2}
</style>
<text class="title" x="36" y="38">Phase 1.2b — Segmentation worsened lateral drift</text>
<text class="small" x="36" y="60">Corrected post-audit results; values are absolute lateral drift in metres</text>
<line class="axis" x1="90" y1="405" x2="770" y2="405"/><line class="axis" x1="90" y1="90" x2="90" y2="405"/>
<line class="grid" x1="90" y1="326" x2="770" y2="326"/><line class="grid" x1="90" y1="247" x2="770" y2="247"/><line class="grid" x1="90" y1="168" x2="770" y2="168"/><line class="grid" x1="90" y1="90" x2="770" y2="90"/>
<text class="small" x="51" y="409">0.0</text><text class="small" x="51" y="330">0.5</text><text class="small" x="51" y="251">1.0</text><text class="small" x="51" y="172">1.5</text><text class="small" x="51" y="94">2.0</text>
<line x1="90" y1="350" x2="770" y2="350" stroke="#cf222e" stroke-dasharray="6 5"/><text class="small" x="765" y="342" text-anchor="end">0.35 m nominal corridor limit</text>
<!-- Direct -->
<polyline points="180,361 420,318 660,255" fill="none" stroke="#0969da" stroke-width="3"/><circle cx="180" cy="361" r="5" fill="#0969da"/><circle cx="420" cy="318" r="5" fill="#0969da"/><circle cx="660" cy="255" r="5" fill="#0969da"/>
<!-- Continuous -->
<polyline points="180,336 420,284 660,217" fill="none" stroke="#1a7f37" stroke-width="3"/><circle cx="180" cy="336" r="5" fill="#1a7f37"/><circle cx="420" cy="284" r="5" fill="#1a7f37"/><circle cx="660" cy="217" r="5" fill="#1a7f37"/>
<!-- Reset -->
<polyline points="180,335 420,253 660,142" fill="none" stroke="#cf222e" stroke-width="3"/><circle cx="180" cy="335" r="5" fill="#cf222e"/><circle cx="420" cy="253" r="5" fill="#cf222e"/><circle cx="660" cy="142" r="5" fill="#cf222e"/>
<!-- State-aware -->
<polyline points="180,343 420,292 660,231" fill="none" stroke="#8250df" stroke-width="3"/><circle cx="180" cy="343" r="5" fill="#8250df"/><circle cx="420" cy="292" r="5" fill="#8250df"/><circle cx="660" cy="231" r="5" fill="#8250df"/>
<text class="label" x="180" y="430" text-anchor="middle">4 m</text><text class="label" x="420" y="430" text-anchor="middle">6 m</text><text class="label" x="660" y="430" text-anchor="middle">8 m</text>
<circle cx="145" cy="466" r="5" fill="#0969da"/><text class="small" x="157" y="470">Direct long</text>
<circle cx="275" cy="466" r="5" fill="#1a7f37"/><text class="small" x="287" y="470">Segmented continuous</text>
<circle cx="465" cy="466" r="5" fill="#cf222e"/><text class="small" x="477" y="470">Segmented reset</text>
<circle cx="615" cy="466" r="5" fill="#8250df"/><text class="small" x="627" y="470">State-aware</text>
</svg>