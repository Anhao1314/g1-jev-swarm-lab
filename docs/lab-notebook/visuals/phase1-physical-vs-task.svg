<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Phase 1.2 physical versus task success</title><desc id="desc">Bar chart showing 91 of 91 physical successes and 54 of 91 task successes.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
.title{font-size:20px;font-weight:700}.label{font-size:13px}.small{font-size:11px;fill:#57606a}
.grid{stroke:#d0d7de;stroke-width:1}.axis{stroke:#57606a;stroke-width:1.2}
</style>
<text class="title" x="36" y="38">Phase 1.2 — Physical success ≠ task success</text>
<text class="small" x="36" y="60">91 final runs under the frozen failure-boundary protocol</text>
<line class="axis" x1="90" y1="350" x2="700" y2="350"/><line class="axis" x1="90" y1="90" x2="90" y2="350"/>
<line class="grid" x1="90" y1="285" x2="700" y2="285"/><line class="grid" x1="90" y1="220" x2="700" y2="220"/><line class="grid" x1="90" y1="155" x2="700" y2="155"/><line class="grid" x1="90" y1="90" x2="700" y2="90"/>
<text class="small" x="52" y="354">0</text><text class="small" x="45" y="289">25</text><text class="small" x="45" y="224">50</text><text class="small" x="45" y="159">75</text><text class="small" x="38" y="94">100</text>
<rect x="185" y="113" width="150" height="237" rx="5" fill="#0969da"/><rect x="455" y="209" width="150" height="141" rx="5" fill="#8250df"/>
<text x="260" y="103" text-anchor="middle" font-size="18" font-weight="700">91 / 91</text><text x="530" y="199" text-anchor="middle" font-size="18" font-weight="700">54 / 91</text>
<text class="label" x="260" y="377" text-anchor="middle">Physical success</text><text class="label" x="530" y="377" text-anchor="middle">Task success</text>
<text class="small" x="380" y="410" text-anchor="middle">The robot stayed physically stable while many missions violated the task envelope.</text>
</svg>