<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="828" viewBox="0 0 1200 828" role="img" aria-labelledby="figTitle figDesc" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="figTitle">Phase 2.2b &#8212; Efficiency Cost of Safety Architectures</title>
  <desc id="figDesc">Fresh-blind campaign (n=179 per treatment) efficiency comparison of treatments A direct_llm_v1 (Frozen Direct LLM), B guarded_direct_llm_v1 (Guarded Direct LLM), C canonical_bridge (Canonicalization Bridge) and D simplex_canonical (Simplex Canonical Compiler). Panel A shows system latency median and P95 in seconds (A and C measured online; B and D provider-inclusive reconstruction, drawn with dashed outlines). Panel B shows mean provider tokens per user mission. Panel C shows the LLM invocation rate. Panel D shows savings vs A: provider calls avoided and provider tokens saved, as recorded in final evidence. Sources: latency_attribution.json, tokens.json, comparison.json (campaign fresh_blind).</desc>
  <metadata id="evidence">{"campaign":"fresh_blind","samples_per_treatment":179,"sources":["experiments/phase2/simplex_compiler_001/latency_attribution.json","experiments/phase2/simplex_compiler_001/tokens.json","experiments/phase2/simplex_compiler_001/comparison.json"],"latency_kind":{"A":"measured_online","B":"provider_inclusive_reconstruction","C":"measured_online","D":"provider_inclusive_reconstruction"},"treatments":{"A":"direct_llm_v1","B":"guarded_direct_llm_v1","C":"canonical_bridge","D":"simplex_canonical"}}</metadata>
  <rect width="1200" height="828" fill="#ffffff"/>

