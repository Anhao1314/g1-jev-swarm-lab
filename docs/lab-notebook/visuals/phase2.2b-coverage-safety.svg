<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="figTitle figDesc" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="figTitle">Phase 2.2b &#8212; Coverage vs Safety</title>
  <desc id="figDesc">Fresh-blind campaign comparison of four treatments. Left panel shows open valid coverage and valid exact IR rates against the 0.98 hard gate. Right panels show unsafe acceptance counts and silent repair rates against the hard gate of 0. Treatment A (direct_llm_v1) records 37 unsafe acceptances and a silent repair rate of 0.5; treatments B, C and D record zero on both safety metrics, while C and D fall below the 0.98 coverage gate.</desc>
